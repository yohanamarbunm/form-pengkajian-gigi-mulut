<script>
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));

  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));

// Fungsi ambil sesi terakhir dari API
async function getSesiTerakhir(idpasien, idkunjungan) {
  try {
    const response = await fetch(
      `http://192.168.137.219/Aplikasita/Api/checksesi?idpasien=${idpasien}&idkunjugan=${idkunjungan}`
    );
    const data = await response.json();
    console.log("Cek sesi response:", data);

    if (data.status === "success" && typeof data.sesi === "number") {
      return data.sesi;
    } else {
      return 0; 
    }
  } catch (error) {
    console.error("Gagal ambil sesi terakhir:", error);
    return 0;
  }
}
