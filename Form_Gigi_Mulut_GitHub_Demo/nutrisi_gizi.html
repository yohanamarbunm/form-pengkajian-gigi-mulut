 <div class="container mt-3">

<!-- SKRINNING GIZI -->
 
<span class="align-items-center  fw-bold ms-3 " style="text-shadow: #007EA7 1px 1px 2px;">SKRINNING GIZI</span>

  <div class="container my-4">
  <label class="form-label fw-bold">
    1. Apakah pasien mengalami penurunan berat badan yang tidak direncanakan/tidak diinginkan dalam 6 bulan terakhir?
  </label>

  
<!-- </div> -->

    <form>
      <!-- Opsi utama -->
      <div class="form-check">
        <input class="form-check-input" type="radio" name="penurunanBB" id="opsiTidak" value="0" checked>
        <label class="form-check-label" for="opsiTidak">Tidak</label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="radio" name="penurunanBB" id="opsiTidakYakin" value="2">
        <label class="form-check-label" for="opsiTidakYakin">
          Tidak yakin (ada tanda: baju menjadi lebih longgar)
        </label>
      </div>

      <!-- Opsi YA -->
      <div class="form-check">
        <input class="form-check-input" type="radio" name="penurunanBB" id="opsiYa" value="1">
        <label class="form-check-label" for="opsiYa">Ya, ada penurunan berat badan sebanyak:</label>
      </div>

      <!-- jika Ya -->
      <div class="ms-4 mt-2" id="opsiYaDetail" style="display: none;">
        <div class="form-check">
          <input class="form-check-input radioYaDetail" type="radio" name="detailYa" id="ya1" value="1">
          <label class="form-check-label" for="ya1">1–5 kg</label>
        </div>
        <div class="form-check">
          <input class="form-check-input radioYaDetail" type="radio" name="detailYa" id="ya2" value="2">
          <label class="form-check-label" for="ya2">6–10 kg</label>
        </div>
        <div class="form-check">
          <input class="form-check-input radioYaDetail" type="radio" name="detailYa" id="ya3" value="3">
          <label class="form-check-label" for="ya3">11–15 kg</label>
        </div>
        <div class="form-check">
          <input class="form-check-input radioYaDetail" type="radio" name="detailYa" id="ya4" value="4">
          <label class="form-check-label" for="ya4">>15 kg</label>
        </div>
        <div class="form-check">
          <input class="form-check-input radioYaDetail" type="radio" name="detailYa" id="ya5" value="2">
          <label class="form-check-label" for="ya5">Tidak tahu berapa penurunannya</label>
        </div>
      </div>

      <!-- Hasil skor -->
      <div class="mt-3">
        <label for="skorTotal" class="form-label fw-bold">Skor:</label>
        <input type="text" id="skorTotal" class="form-control w-50" readonly value="0">
      </div>
    </form>

  <!-- Nilai skor -->

</form>

  <label class="form-check-label" for="tidakanoreksia">Tidak</label>

        </div>

<div class="row mt-3 align-items-center">

<!-- me-load toast -->
<div id="toast-container"></div>

<script>
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));


  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));


</script>
