<form id="formPasien" class="needs-validation" novalidate data-page="riwayat_kesehatan.html">

          <!-- RIWAYAT MASUK RS -->
      <div class="row mb-3 align-items-start mt-3">
          <label for="riwayat" class="col-sm-2 col-form-label">
            Riwayat Masuk RS 
          </label>
          <div class="col-sm-10 mt-2">
            <div class="form-check form-check-inline mb-2">
              <input class="form-check-input" type="radio" name="riwayatRS" id="radioTidakRS" onchange="toggleForm('RS')" value="tidak" checked>
              <label class="form-check-label" for="radioTidakRS">Tidak</label>
            </div>
            <div class="form-check form-check-inline mb-2">
              <input class="form-check-input" type="radio" name="riwayatRS" id="radioYaRS" onchange="toggleForm('RS')" value="ya">
              <label class="form-check-label" for="radioYaRS">Ya, dengan keterangan</label>
            </div>
        
            <div id="formGroupRS" style="display: none;" class="mt-2">
              <div class="mb-2">
                <label class="form-label">Jenis Penyakit</label>
                <input type="text" name="jenispenyakit"class="form-control" placeholder="Contoh: Diabetes" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Lama dirawat</label>
                <input type="text" name="lama_diraawat" class="form-control" placeholder="Contoh: 2 bulan" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Nama Rumah Sakit</label>
                <input type="text" name="nama_ruma_sakit" class="form-control" placeholder="Contoh: RSUD Tarutung" required>
              </div>
            </div>

        <label class="form-check-label" for="radioTidakOperasi">Tidak</label>
      </div>
      <div class="form-check form-check-inline mb-2">
        <input class="form-check-input" type="radio" name="riwayatOperasi" id="radioYaOperasi" onchange="toggleForm('Operasi')" value="ya">

      </div>
  
      <div id="formGroupOperasi" style="display: none;" class="mt-2">

          <label class="form-label">Jenis Operasi</label>

    </div>

            <option value="Lain" for="lainnyaTextbox">Lain-Lain</option>
          </select>

 <!-- me-load toast -->
<div id="toast-container"></div>

<script>
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));

    // divider atas
  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));

</script>
