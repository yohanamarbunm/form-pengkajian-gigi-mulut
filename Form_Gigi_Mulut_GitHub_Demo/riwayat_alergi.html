<script>
  document.getElementById("formPasien").addEventListener("submit", function (event) {
    const form = this;
    let isValid = true;

    function validateIfChecked(checkboxId, inputNames) {
      const check = document.getElementById(checkboxId);
      inputNames.forEach(name => {
        const input = form.querySelector(`[name="${name}"]`);
        if (check.checked) {
          input.setAttribute("required", "required");
          if (!input.value.trim()) {
            input.classList.add("is-invalid");
            input.classList.remove("is-valid");
            isValid = false;
          } else {
            input.classList.remove("is-invalid");
            input.classList.add("is-valid");
          }
        } else {
          input.removeAttribute("required");
          input.classList.remove("is-invalid", "is-valid");
        }
      });
    }

    validateIfChecked("checkalergiobat", ["alergi_obat", "reaksi_obat"]);
    validateIfChecked("checkalergimakanan", ["alergi_makanan", "reaksi_makanan"]);
    validateIfChecked("checkalergilain", ["alergi_lain", "reaksi_lain"]);

    if (!isValid) {
      event.preventDefault();
      event.stopPropagation();
      form.classList.add("was-validated");
    }
  });
</script>

<!-- me-load toast -->
<div id="toast-container"></div>

<script>
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));

  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));

</script>
