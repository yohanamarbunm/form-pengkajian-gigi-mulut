 <form id="formPasien" class="needs-validation" novalidate data-page="riwayat_penggunaan_obat.html">    
<!-- Riwayat Penggunaan Obat -->

        <h5 class="fw-bold " style="color:#007EA7 ;">RIWAYAT PENGGUNAAN OBAT</h5>
     </div>

    <!-- <label class="col-sm-3 col-form-label d-flex align-items-center justify-content-end"> -->

        <div class="form-check form-check-inline mb-2">
            <input class="form-check-input" type="radio" name="riwayatObat" id="radioTidakObat" value="tidak" onchange="toggleObatTable()" checked>
            <label class="form-check-label" for="radioTidakObat">Tidak Pernah</label>
        </div>
        <div class="form-check form-check-inline mb-2" style="margin-left: 0;">
            <input class="form-check-input" type="radio" name="riwayatObat" id="radioAdaObat" value="ada" onchange="toggleObatTable()">
            <label class="form-check-label" for="radioAdaObat">Pernah</label>
        </div>
        <div id="obatTableContainer" style="display: none;" class="mt-3">
    <div class="table">
        <table class="table table-bordered align-middle" id="obatTable" style="width: 100%; font-size: 0.85rem; white-space: normal;">
            <thead class="table-light text-center">
                <tr>
                    <th style="width: 5%;">No</th>
                    <th style="width: 20%;">Nama Obat</th>
                    <th style="width: 15%;">Dosis</th>
                    <th style="width: 20%;">Cara Pemberian</th>
                    <th style="width: 15%;">Frekuensi</th>
                    <th style="width: 20%;">Waktu & Tanggal</th>
                    <th style="width: 5%;">Aksi</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center">1</td>
                    <td><input type="text" class="form-control form-control-sm" name="nama_obat[]"></td>
                    <td><input type="text" class="form-control form-control-sm" name="dosis[]"></td>
                    <td><input type="text" class="form-control form-control-sm" name="cara_pemberian[]"></td>
                    <td><input type="text" class="form-control form-control-sm" name="frekuensi[]"></td>
                    <td><input type="text" class="form-control form-control-sm" name="waktu_tanggal[]"></td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-sm" onclick="hapusBarisObat(this)" style="font-size: 0.75rem;">
                            Hapus
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

<div class="p-4  mt-4 mb-1"></div>

  <!-- me-load toast -->
<div id="toast-container"></div>

<script>
  // Toast untuk konfirmasi
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));


    // Divider/Breadcumb
  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));


    // Logic untuk submit dan tabel supaya muncul 

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('formPasien');
  if (!form) return;
  const pageKey = form.dataset.page;
  const saved = localStorage.getItem(pageKey);

  if (saved) {
    const data = JSON.parse(saved);

    if (data["riwayatObat"] === "ada") {
      document.getElementById("radioAdaObat").checked = true;
    } else {
      document.getElementById("radioTidakObat").checked = true;
    }

    toggleObatTable();

    if (Array.isArray(data["nama_obat[]"])) {
      const tableBody = document.querySelector("#obatTable tbody");
      tableBody.innerHTML = "";

      for (let i = 0; i < data["nama_obat[]"].length; i++) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="text-center">${i + 1}</td>
          <td><input type="text" class="form-control form-control-sm" name="nama_obat[]" value="${data["nama_obat[]"][i] || ""}"></td>
          <td><input type="text" class="form-control form-control-sm" name="dosis[]" value="${data["dosis[]"]?.[i] || ""}"></td>
          <td><input type="text" class="form-control form-control-sm" name="cara_pemberian[]" value="${data["cara_pemberian[]"]?.[i] || ""}"></td>
          <td><input type="text" class="form-control form-control-sm" name="frekuensi[]" value="${data["frekuensi[]"]?.[i] || ""}"></td>
          <td><input type="text" class="form-control form-control-sm" name="waktu_tanggal[]" value="${data["waktu_tanggal[]"]?.[i] || ""}"></td>
          <td class="text-center">
            <button type="button" class="btn btn-danger btn-sm" onclick="hapusBarisObat(this)">Hapus</button>
          </td>
        `;
        tableBody.appendChild(row);
      }
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const data = {};
    const inputs = form.querySelectorAll("input, select, textarea");

    inputs.forEach((input) => {
      const name = input.name;
      if (!name) return;

      if (name.endsWith("[]")) {
        if (!data[name]) data[name] = [];
        data[name].push(input.value);
      } else if (input.type === "checkbox") {
        if (!data[name]) data[name] = [];
        if (input.checked) data[name].push(input.value);
      } else if (input.type === "radio") {
        if (input.checked) data[name] = input.value;
      } else {
        data[name] = input.value;
      }
    });

    localStorage.setItem(pageKey, JSON.stringify(data));
   
  });
});


</script>
