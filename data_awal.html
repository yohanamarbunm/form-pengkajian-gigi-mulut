<!-- Pembuka untuk bagian pertama -->

<form id="formPasien" class="needs-validation" novalidate data-page="data_awal.html">

  <div class="container bg-light p-4 rounded shadow mt-4 mb-4" style="font-weight: 500;">
    <div class="mb-1">
      <label for="RM1" class="form-label">No. RM</label>
      <input  type="number" name="nomorRM" class="form-control" id="RM1" placeholder="Isi nomor RM" pattern="\d{6}" maxlength="6">
      <div class="invalid-feedback">No. RM harus terdiri dari 6 angka.</div>
    </div>
  </div>  




  <div class="container mb-4" style="font-weight:500;">
    <div class="row shadow">
      <!-- Kolom 1 -->
      <div class="col-md-4 bg-light p-4 rounded border-end-md">
        <div class="mb-1">
          <label for="nama" class="form-label">Nama</label>
          <input type="text" name="nama" class="form-control" id="nama" placeholder="Isi nama">
        </div>

        <div class="mb-1">
          <label for="jenis_kelamin" class="form-label">Jenis Kelamin</label>
          <select id="jenis_kelamin" name="jenis_kelamin" class="form-select">
            <option selected disabled hidden value="">Pilih jenis kelamin</option>
            <option value="lk">Laki-laki</option>
            <option value="pr">Perempuan</option>
          </select>
        </div>

        <div class="mb-1">
          <label for="ttl1" class="form-label">Tanggal Lahir</label>
          <input type="date" name="tgl_lahir" class="form-control" id="ttl1">
        </div>

        <div class="mb-1">
          <label for="MR1" class="form-label">No. MR</label>
          <input type="text" name="noMR" class="form-control" id="MR1" placeholder="Isi nomor MR">
        </div>
      </div>

      <!-- Kolom 2 -->
      <div class="col-md-4 bg-light p-4 border-end-md rounded">
        <div class="mb-1">
          <label for="tiba2" class="form-label">Tiba di Poli</label>
          <input type="date" name="tiba_dipoli" class="form-control" id="tiba2" required>

          <label for="jamtiba2" class="form-label mt-2" style="font-weight: 400;">Jam</label>
          <input type="time" name="jamtiba_dipoli" class="form-control" id="jamtiba2" required>
        </div>

        <div class="mb-1">
          <label for="kaji2" class="form-label">Pengkajian</label>
          <input type="date" name="pengkajian" class="form-control" id="kaji2" required>

          <label for="jamtiba3" class="form-label mt-2" style="font-weight: 400;">Jam</label>
          <input type="time" name="jamtiba_pengkajian" class="form-control" id="jamtiba3" required>
        </div>
      </div>

      <!-- Kolom 3 -->
      <div class="col-md-4 bg-light p-4 rounded">
        <div class="mb-1">
          <label class="form-label">Sumber Data</label>
          <div class="form-check">
            <input class="form-check-input" name="sumberdata[]" type="checkbox" value="Pasien" id="checkpasien" >
            <label class="form-check-label" for="checkpasien">Pasien</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" name="sumberdata[]" type="checkbox" value="Keluarga" id="checkkeluarga">
            <label class="form-check-label" for="checkkeluarga">Keluarga</label>
          </div>
        </div>

        <div class="mb-1">
          <label for="lainnyasumberdata" class="form-label">Lainnya</label>
          <input type="text" name="lainnya_sumber_data" class="form-control" id="lainnyasumberdata" placeholder="Tulis sumber data">
        </div>
        <div class="form-text text-danger d-none" id="sumberError">
  Minimal salah satu sumber data (Pasien, Keluarga, atau Lainnya) harus diisi.
</div>

      </div>

    <!-- TOmbol -->
<div class="container mt-4">
  <div class="row gy-2">
    <div class="col-12 col-md-6 text-md-start text-center">
    </div>
    <div class="col-12 col-md-6 text-md-end text-center">
    <!-- <button style="color: white;" type="button" class="btn btn-warning me-2 fw-bold" onclick="resetForm()">Reset</button>
    <button type="button" class="btn btn-success me-2 fw-bold" onclick="updateForm()">Update</button> -->
    <button  style="background-color: #007EA7; color: white;" type="submit" class="btn  fw-bold">Simpan & Lanjut</button>
    </div>
  </div>
</div>

<script>

document.getElementById("formPasien").addEventListener("submit", async function (e) {
  e.preventDefault();

  if (!validateCheckboxGroup()) return;

 const nomorRM = document.getElementById("RM1").value;
const nama = document.getElementById("nama").value;
const waktutiba = gabungTanggalJam("tiba2", "jamtiba2");
const waktukaji = gabungTanggalJam("kaji2", "jamtiba3");

const sumberCheckbox = document.querySelectorAll('input[name="sumberdata[]"]:checked');
let sumberdata = Array.from(sumberCheckbox).map(el => el.value);

const inputLainnya = document.getElementById("lainnyasumberdata");
if (inputLainnya && inputLainnya.value.trim() !== "") {
  sumberdata.push(inputLainnya.value.trim());
}

// Fungsi Timestamp
function gabungTanggalJam(tanggalId, jamId) {
  const tanggal = document.getElementById(tanggalId).value;
  const jam = document.getElementById(jamId).value;
  return `${tanggal} ${jam}:00`; 
}


 const payload = {
  waktutiba,
  waktukaji,
  sumberdata: sumberdata.join(", "), 
  idpasien: 1,
  idkunjungan: "2", 
  sesi: 1
};



  try {
    const response = await fetch("http://192.168.137.219/Aplikasita/Api/addidentitaspasien", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      alert("Data berhasil dikirim ke server.");
    } else {
      alert("Gagal mengirim data ke server.");
    }
  } 
  catch (error) {
    console.error("Error saat mengirim data:", error);
    alert("Terjadi kesalahan koneksi.");
  }
});



// Untuk divider
  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));



// Validasi  untuk sumber data
function validateCheckboxGroup() {
  const pasien = document.getElementById("checkpasien");
  const keluarga = document.getElementById("checkkeluarga");
  const lainnya = document.getElementById("lainnyasumberdata");
  const error = document.getElementById("sumberError");

  const isValid = pasien.checked || keluarga.checked || lainnya.value.trim() !== "";
  if (!isValid) {
    error.classList.remove("d-none");
    pasien.classList.add("is-invalid");
    keluarga.classList.add("is-invalid");
    lainnya.classList.add("is-invalid");
  } else {
    error.classList.add("d-none");
    pasien.classList.remove("is-invalid");
    keluarga.classList.remove("is-invalid");
    lainnya.classList.remove("is-invalid");
  }

  return isValid;
}


const rmInput = document.getElementById("RM1");
rmInput.addEventListener("input", () => {
  const isValid = /^\d{6}$/.test(rmInput.value.trim());
  rmInput.classList.toggle("is-valid", isValid);
  rmInput.classList.toggle("is-invalid", !isValid);
});

</script>

  fetch("komponen/toast.html")

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));


    
</script>
