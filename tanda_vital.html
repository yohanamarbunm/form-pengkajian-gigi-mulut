<script>
// Toast untuk konfirmasi
  fetch("komponen/toast.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("toast-container").innerHTML = html;

      const script = document.createElement("script");
      script.src = "js/form-autosave.js";
      document.body.appendChild(script);
    })
    .catch(err => console.error("Gagal memuat komponen toast:", err));

// Divider
  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));


// ===== LOGIKA VALIDASI DAN SIMPAN & LANJUT =====
document.getElementById("formPasien").addEventListener("submit", function (e) {
  e.preventDefault();

  const form = e.target;

  // Validasi manual
  const requiredFields = [
    "pernapasan",
    "nadi",
    "sistolik",
    "diastolik",
    "suhu",
    "kesadaran",
    "input_Vas",
    "riwayatNyeri"
  ];

  let isValid = true;

  requiredFields.forEach(name => {
    const el = form.querySelector(`[name="${name}"]`);
    if (el && !el.value.trim()) {
      el.classList.add("is-invalid");
      isValid = false;
    } else if (el) {
      el.classList.remove("is-invalid");
    }
  });

  // Validasi jika nyeri == ya → harus isi detail nyeri
  const nyeriChecked = form.querySelector('[name="riwayatNyeri"]:checked')?.value;
  if (nyeriChecked === "ya") {
    const nyeriFields = ["pemicu", "kualitas", "lokasi", "skala_nyeri", "time"];
    nyeriFields.forEach(name => {
      const el = form.querySelector(`[name="${name}"]`);
      if (!el || !el.value.trim()) {
        el.classList.add("is-invalid");
        isValid = false;
      } else {
        el.classList.remove("is-invalid");
      }
    });
  }

  if (!isValid) {
    showToast("Harap lengkapi semua data yang wajib diisi.", "bg-danger");
    return;
  }

  // Simpan data ke localStorage
  const formData = new FormData(form);
  const dataObj = {};

  for (let [key, value] of formData.entries()) {
    if (dataObj[key]) {
      if (!Array.isArray(dataObj[key])) dataObj[key] = [dataObj[key]];
      dataObj[key].push(value);
    } else {
      dataObj[key] = value;
    }
  }

  const currentPage = form.dataset.page || "tanda_vital.html";
  localStorage.setItem(currentPage, JSON.stringify(dataObj));

  showToast("Data berhasil disimpan. Menuju halaman selanjutnya...", "bg-success");

  // Pindah ke halaman berikut setelah delay
  setTimeout(() => {
    window.location.href = "aktivitas.html"; // GANTI dengan halaman berikutnya
  }, 1200);
});

// Restore data saat halaman dibuka kembali
window.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("formPasien");
  const currentPage = form.dataset.page || "tanda_vital.html";
  const saved = localStorage.getItem(currentPage);

  if (!saved) return;

  const data = JSON.parse(saved);
  for (let name in data) {
    const field = form.querySelectorAll(`[name="${name}"]`);

    field.forEach(input => {
      if (input.type === "checkbox" || input.type === "radio") {
        if (Array.isArray(data[name])) {
          input.checked = data[name].includes(input.value);
        } else {
          input.checked = input.value === data[name];
        }
      } else {
        input.value = data[name];
      }
    });

    // Tampilkan form nyeri jika sebelumnya memilih "ya"
    if (name === "riwayatNyeri" && data[name] === "ya") {
      toggleFormNyeri("Nyeri");
    }
  }
});

function showToast(message, toastClass = "bg-success") {
  const toastContainer = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast align-items-center text-white ${toastClass} border-0 show`;
  toast.role = "alert";
  toast.innerHTML = `
    <div class="d-flex">
      <div class="toast-body">${message}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>`;
  toastContainer.appendChild(toast);

  setTimeout(() => toast.remove(), 3000);
}

</script>
