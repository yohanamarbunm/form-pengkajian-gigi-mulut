    <!-- Form Keterangan Gigi -->
    <div id="descriptions" class="row gy-2"></div>
  </div>


  <script>
    const teeth = document.querySelectorAll(".tooth");
    const descriptions = document.getElementById("descriptions");

    teeth.forEach(tooth => {
      tooth.addEventListener("click", () => {
        const id = tooth.id;
        const existing = document.getElementById("desc-" + id);
        tooth.classList.toggle("selected");

        if (tooth.classList.contains("selected")) {
          if (!existing) {
            const wrapper = document.createElement("div");
            wrapper.className = "col-12 description-box";
            wrapper.id = "desc-" + id;
            wrapper.innerHTML = `
              <div class="d-flex align-items-center gap-2">
                <div class="flex-grow-1">
                  <label class="form-label">Keterangan Gigi Nomor ${tooth.textContent}:</label>
                  <input type="text" class="form-control" placeholder="Masukkan keterangan untuk gigi nomor ${tooth.textContent}" />
                </div>
                <div class="hapusform">
                  <button class="btn btn-outline-danger btn-sm" title="Hapus">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            `;
            descriptions.appendChild(wrapper);

            // Hapus
            wrapper.querySelector("button").addEventListener("click", () => {
              wrapper.remove();
              tooth.classList.remove("selected");
            });
          }
        } else {
          if (existing) existing.remove();
        }
      });
    });
  </script>
