<form id="formPasien" class="needs-validation" novalidate data-page="data_awal.html">

      <div class="mb-3">
        <label for="loginRole" class="form-label small" style="font-weight: 700;">Pilih</label>
        <select id="loginRole" class="form-select" required>
          <option value="perawat">Perawat</option>
          <option value="dokter_gigi">Dokter Gigi</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="loginUsername" class="form-label small" style="font-weight: 700;">Username</label>
        <input id="loginUsername" class="form-control" type="text" placeholder="Username" required autocomplete="username">
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="form-label small" style="font-weight: 700;">Password</label>
        <div class="input-group">
          <input id="loginPassword" class="form-control" type="password" placeholder="Password" required autocomplete="current-password">
          <!-- <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Toggle password">Tampilkan</button> -->
        </div>
      </div>

      <div id="loginError" class="form-text text-danger mb-2 d-none"></div>

      <div class="d-grid mt-2">
        <button type="button" id="loginBtn" class="btn" style="background:linear-gradient(90deg,#007EA7,#00A7C4); color:#fff; font-weight:700;">Masuk</button>
      </div>

      <div class="text-center mt-3">
        <a href="#" class="small text-muted">Lupa password?</a>
      </div>
    </div>

    <script>
      (function () {
        const roleEl = document.getElementById('loginRole');
        const userEl = document.getElementById('loginUsername');
        const passEl = document.getElementById('loginPassword');
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('loginError');
        const toggle = document.getElementById('togglePassword');

        // Prevent Enter key from submitting outer form when focusing these inputs
        [userEl, passEl].forEach(el => {
          el.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') ev.preventDefault();
          });
        });

        if (toggle) {
          toggle.addEventListener('click', () => {
            const isPwd = passEl.type === 'password';
            passEl.type = isPwd ? 'text' : 'password';
            toggle.textContent = isPwd ? 'Sembunyikan' : 'Tampilkan';
          });
        }

        btn.addEventListener('click', async () => {
          err.classList.add('d-none');
          const role = roleEl.value;
          const username = userEl.value.trim();
          const password = passEl.value;

          if (!username || !password) {
            err.textContent = 'Isi username dan password.';
            err.classList.remove('d-none');
            return;
          }

          try {
            const res = await fetch('http://192.168.137.219/Aplikasita/Api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role, username, password })
            });

            if (!res.ok) {
              const text = await res.text().catch(() => null);
              err.textContent = text || 'Login gagal. Periksa kredensial.';
              err.classList.remove('d-none');
              return;
            }

            // sukses: redirect sesuai role (sesuaikan dengan rute aplikasi)
            localStorage.setItem('rsudTarutungDemoUser', JSON.stringify({ role, username, loggedInAt: new Date().toISOString() }));
            window.location.href = 'index.html';
          } catch (e) {
            err.textContent = 'Terjadi kesalahan koneksi.';
            err.classList.remove('d-none');
            console.error(e);
          }
        });
      })();
    </script>

<script>

document.getElementById("formPasien").addEventListener("submit", async function (e) {
  e.preventDefault();

  if (!validateCheckboxGroup()) return;

 const nomorRM = document.getElementById("RM1").value;
const nama = document.getElementById("nama").value;
const waktutiba = gabungTanggalJam("tiba2", "jamtiba2");
const waktukaji = gabungTanggalJam("kaji2", "jamtiba3");

const sumberCheckbox = document.querySelectorAll('input[name="sumberdata[]"]:checked');
let sumberdata = Array.from(sumberCheckbox).map(el => el.value);

const inputLainnya = document.getElementById("lainnyasumberdata");
if (inputLainnya && inputLainnya.value.trim() !== "") {
  sumberdata.push(inputLainnya.value.trim());
}

// Fungsi Timestamp
function gabungTanggalJam(tanggalId, jamId) {
  const tanggal = document.getElementById(tanggalId).value;
  const jam = document.getElementById(jamId).value;
  return `${tanggal} ${jam}:00`; 
}


 const payload = {
  waktutiba,
  waktukaji,
  sumberdata: sumberdata.join(", "), 
  idpasien: 1,
  idkunjungan: "2", 
  sesi: 1
};



  try {
    const response = await fetch("http://192.168.137.219/Aplikasita/Api/addidentitaspasien", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (response.ok) {
      alert("Data berhasil dikirim ke server.");
    } else {
      alert("Gagal mengirim data ke server.");
    }
  } catch (error) {
    console.error("Error saat mengirim data:", error);
    alert("Terjadi kesalahan koneksi.");
  }
});



// Untuk divider
  fetch("komponen/divider.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("breadcrumb-container").innerHTML = html;

      const current = window.location.pathname.split("/").pop().toLowerCase();
      const items = document.querySelectorAll(".breadcrumb-item");

      items.forEach(item => {
        const page = item.getAttribute("data-halaman")?.toLowerCase();
        if (page === current) {
          item.classList.add("active");
          item.setAttribute("aria-current", "page");
          const link = item.querySelector("a");
          if (link) {
            link.removeAttribute("href");
          }
        }
      });
    })
    .catch(err => console.error("Gagal memuat breadcrumb:", err));



// Validasi  untuk sumber data
function validateCheckboxGroup() {
  const pasien = document.getElementById("checkpasien");
  const keluarga = document.getElementById("checkkeluarga");
  const lainnya = document.getElementById("lainnyasumberdata");
  const error = document.getElementById("sumberError");

  const isValid = pasien.checked || keluarga.checked || lainnya.value.trim() !== "";
  if (!isValid) {
    error.classList.remove("d-none");
    pasien.classList.add("is-invalid");
    keluarga.classList.add("is-invalid");
    lainnya.classList.add("is-invalid");
  } else {
    error.classList.add("d-none");
    pasien.classList.remove("is-invalid");
    keluarga.classList.remove("is-invalid");
    lainnya.classList.remove("is-invalid");
  }

  return isValid;
}


const rmInput = document.getElementById("RM1");
rmInput.addEventListener("input", () => {
  const isValid = /^\d{6}$/.test(rmInput.value.trim());
  rmInput.classList.toggle("is-valid", isValid);
  rmInput.classList.toggle("is-invalid", !isValid);
});

</script>
